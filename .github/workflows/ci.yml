on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nixos-ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The hosted ARM64 runner exposes no KVM device, see
          # actions/runner-images#14062. The ARM64 images build here, but
          # the boot tests run on x86_64 only.
          - runner: ubuntu-24.04-arm
            arch: arm64
            system: aarch64-linux
            kvm: false
          - runner: ubuntu-24.04
            arch: x86_64
            system: x86_64-linux
            kvm: true
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
        with:
          persist-credentials: false
      # crosvm and the NixOS VM test require KVM.
      - name: Enable KVM for the boot tests
        if: matrix.kvm
        run: |
          uname -m -r
          ls -l /dev/kvm || true
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: DeterminateSystems/determinate-nix-action@1d699fc25db3f9e079cd2f168ca007a4183389be  # v3.15.1
      - uses: DeterminateSystems/flake-checker-action@3164002371bc90729c68af0e24d5aacf20d7c9f6  # v12

      - run: nix flake check --no-build
      - run: nix build --no-link .#baguette-tarball .#lxc-image-and-metadata
      # The quick start of the README, as written: every `quick-start`
      # block, in order, with this checkout in place of the repository on
      # GitHub. The copy carries the lock file, so it builds the same
      # nixpkgs.
      - name: Follow the quick start of the README
        run: |
          nix registry add github:aldur/nixos-crostini path:$GITHUB_WORKSPACE
          awk '/^```bash quick-start$/ { on = 1; next } /^```$/ { on = 0 } on' README.md > /tmp/quick-start.sh
          mkdir /tmp/quick-start
          cd /tmp/quick-start
          bash -euxo pipefail /tmp/quick-start.sh
      - name: Boot the Baguette image
        if: matrix.kvm
        run: nix build -L --out-link boot-test .#checks.${{ matrix.system }}.baguette-boot
      # A failed boot keeps its logs in the job output, through the trap
      # of the test. The link exists on success only.
      - name: Upload boot logs and screenshots
        if: matrix.kvm && success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: baguette-boot-${{ matrix.arch }}
          path: |
            boot-test/*.log
            boot-test/screenshots/
          if-no-files-found: error
      - name: Boot the LXC image
        if: matrix.kvm
        run: nix build -L --no-link .#checks.${{ matrix.system }}.lxc-boot
      - run: nix build .#baguette-zimage

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: zimage-${{ matrix.arch }}
          path: result/*.zst
