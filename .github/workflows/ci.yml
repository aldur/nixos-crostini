on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  nixos-ci:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            arch: arm64
          - runner: ubuntu-24.04
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
        with:
          persist-credentials: false
      - name: Enable KVM for the boot test
        if: matrix.arch == 'x86_64'
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - uses: DeterminateSystems/determinate-nix-action@1d699fc25db3f9e079cd2f168ca007a4183389be  # v3.15.1
      - uses: DeterminateSystems/flake-checker-action@3164002371bc90729c68af0e24d5aacf20d7c9f6  # v12

      - run: nix flake check --no-build
      - run: nix build --no-link .#baguette-tarball .#lxc-image-and-metadata
      # crosvm requires KVM. Keep the ARM64 check available for native
      # hosts with KVM; the hosted ARM runner only builds the images.
      - name: Boot the Baguette image
        if: matrix.arch == 'x86_64'
        run: nix build -L --out-link boot-test .#checks.x86_64-linux.baguette-boot
      - name: Upload boot logs and screenshots
        if: matrix.arch == 'x86_64' && success()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: baguette-boot-x86_64
          path: |
            boot-test/*.log
            boot-test/screenshots/
          if-no-files-found: error
      - run: nix build .#baguette-zimage

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: zimage-${{ matrix.arch }}
          path: result/*.zst
